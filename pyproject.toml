[project]
name = "grillsim"
version = "2.0.0"
description = "Kamado-Grillsimulator mit Wärmemodell, Lüftungssteuerung und PID-Ventilatorregler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
grillsim = "grillsim.app:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
